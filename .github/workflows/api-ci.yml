name: mcp-provisioner-api CI

on:
  push:
    branches: [main]
    paths: ["mcp-provisioner-api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["mcp-provisioner-api/**", ".github/workflows/api-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-provisioner-api
    permissions:
      contents: read
      packages: read
    env:
      # Automatic, workflow-scoped token -- never a manually-managed PAT.
      # Requires this repo to be on @mp4marketing/dual-control's "Manage
      # Actions access" allowlist (one-time, org-owner-only grant -- see the
      # root CLAUDE.md for why there's no API for it), even though both
      # repos are public: GitHub Packages requires auth to install a
      # package regardless of the source repo's visibility.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # registry-url/scope here (not a committed .npmrc) -- REAL BUG found
      # live 2026-09-20: npm's project-config .npmrc lookup is CWD-only, it
      # does NOT walk up to ancestor directories the way git config does.
      # This job's `defaults.run.working-directory: mcp-provisioner-api`
      # put every `run:` step one level below the repo-root .npmrc that
      # used to be this job's only auth source, so npm never saw it at all
      # in CI (confirmed: "authentication token not provided", i.e. no
      # scope/token config found, not merely a bad token -- verified by
      # reproducing the same failure locally only once a leftover global
      # ~/.npmrc from an unrelated earlier session was excluded). These
      # inputs make actions/setup-node write to ~/.npmrc instead, which npm
      # DOES always consult regardless of cwd -- same proven-working
      # pattern as access-admin's own ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: "https://npm.pkg.github.com"
          scope: "@mp4marketing"
      - run: npm install
      - run: npm test

  # Deploy is deliberately NOT wired here yet -- no Cloudflare API token is
  # configured for this repo at the time this workflow was written. Deploy
  # manually with `wrangler deploy` from mcp-provisioner-api/ until a
  # CLOUDFLARE_API_TOKEN secret is added, then add a deploy job mirroring
  # this pattern (test-gated, push-to-main only).
